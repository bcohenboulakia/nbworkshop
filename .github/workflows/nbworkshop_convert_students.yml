name: Notebook conversion to Students branch

on:
  push:
    branches: [main]
    paths: ['**.ipynb']
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/nbworkshop_convert.json
      SUMMARY_FILE: /tmp/nbworkshop-summary.md
      PLAN_FILE: /tmp/nbworkshop-plan.json
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Initialize summary file
        run: |
          printf '## Notebook conversion\n\n' > "$SUMMARY_FILE"

      - name: Validate JSON config
        run: |
          if ! jq empty "$CONFIG_PATH" >/dev/null 2>&1; then
            printf '### Error in JSON configuration file\n' >> "$SUMMARY_FILE"
            jq empty "$CONFIG_PATH" 2>&1 >> "$SUMMARY_FILE" || true
            exit 1
          fi
          npm install ajv@8
          node <<'EOF'
          const fs = require('fs');
          const Ajv = require('ajv').default;
          const schema = {
            type: 'object',
            required: ['solution_marker', 'placeholder', 'generate_zip',
                       'notebooks_dir', 'student_postfix', 'tutor_postfix'],
            properties: {
              solution_marker: {
                type: 'object', required: ['code', 'markdown'],
                properties: { code: {type:'string'}, markdown: {type:'string'} },
                additionalProperties: false
              },
              placeholder: {
                type: 'object', required: ['code', 'markdown'],
                properties: { code: {type:'string'}, markdown: {type:'string'} },
                additionalProperties: false
              },
              generate_zip: {type:'boolean'},
              notebooks_dir: {type:'array', items:{type:'string'}, minItems:1},
              pre_processing: {type:'string'},
              post_processing: {type:'string'},
              tutor_postfix: {type:'string'},
              student_postfix: {type:'string'},
              rebuild_all: {type:'boolean'}
            }
          };
          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, 'utf8'));
          const validate = new Ajv({allErrors:true, strict:true}).compile(schema);
          if (!validate(config)) {
            const report = '### Configuration validation failed\n' +
              validate.errors.map(e => `- ${e.instancePath || '/'} ${e.message}`).join('\n') + '\n';
            fs.appendFileSync(process.env.SUMMARY_FILE, report);
            console.error(report);
            process.exit(1);
          }
          EOF

      - name: Check monitored directories
        run: |
          while IFS= read -r dir; do
            if [ ! -d "$dir" ]; then
              printf 'Missing configured notebook directory: %s\n' "$dir" | tee -a "$SUMMARY_FILE"
              exit 1
            fi
          done < <(jq -r '.notebooks_dir[]' "$CONFIG_PATH")

      - name: Read and validate hooks
        run: |
          pre=$(jq -r '.pre_processing // empty' "$CONFIG_PATH")
          post=$(jq -r '.post_processing // empty' "$CONFIG_PATH")
          if [ -n "$pre" ]; then bash -n <<< "$pre"; fi
          if [ -n "$post" ]; then bash -n <<< "$post"; fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ".github/scripts/nbworkshop_convert.py"

      - name: Install Python dependencies
        run: pip install chardet

      - name: Run pre-processing hook
        run: |
          pre=$(jq -r '.pre_processing // empty' "$CONFIG_PATH")
          if [ -n "$pre" ]; then
            printf '### Pre-processing\n' >> "$SUMMARY_FILE"
            bash -c "$pre" >> "$SUMMARY_FILE" 2>&1
          fi

      - name: Select notebooks from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python .github/scripts/nbworkshop_publish.py plan \
            --config "$CONFIG_PATH" --plan-file "$PLAN_FILE" \
            --event "$EVENT_NAME" --before "$BEFORE" --after "$(git rev-parse HEAD)"

      - name: Convert selected notebooks
        run: |
          printf '### Processing Report\n' >> "$SUMMARY_FILE"
          printf '| Notebook | Questions | Code Blocks | ZIP |\n' >> "$SUMMARY_FILE"
          printf '|----------|-----------|-------------|-----|\n' >> "$SUMMARY_FILE"
          while IFS= read -r nb; do
            uv run .github/scripts/nbworkshop_convert.py "$nb" \
              --config "$CONFIG_PATH" --hide-header >> "$SUMMARY_FILE"
          done < <(jq -r '.convert[]' "$PLAN_FILE")
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ['PLAN_FILE']).read_text())
          with open(os.environ['SUMMARY_FILE'], 'a', encoding='utf-8') as f:
              if p['deleted']:
                  f.write('\nRemoved sources: ' + ', '.join(p['deleted']) + '\n')
          PY

      - name: Run post-processing hook
        run: |
          post=$(jq -r '.post_processing // empty' "$CONFIG_PATH")
          if [ -n "$post" ] && jq -e '(.convert | length) > 0' "$PLAN_FILE" >/dev/null; then
            printf '\n### Post-processing\n' >> "$SUMMARY_FILE"
            bash -c "$post" >> "$SUMMARY_FILE" 2>&1
          fi

      - name: Publish own outputs on Students
        run: |
          python .github/scripts/nbworkshop_publish.py publish \
            --config "$CONFIG_PATH" --plan-file "$PLAN_FILE" \
            --summary "$SUMMARY_FILE" --branch Students

      - name: Conversion summary
        if: always()
        run: |
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
